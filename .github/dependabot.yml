version: 2

# Version updates only. The security half (alerts + security updates) is a repository setting, not config: both are
# switched on for this repository. No docker block: the game runs inside the games-service table-host image.
updates:
  # Test and build tooling (the game itself has no npm dependencies at run time).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      # One PR per group, not per package: checks take minutes each.
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # Majors stay ungrouped and arrive one at a time.

  # The browser check's Python dependency (Playwright).
  - package-ecosystem: pip
    directory: /scripts/e2e
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    labels:
      - dependencies
    commit-message:
      prefix: deps-dev

  # Workflow actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
